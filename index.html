<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viggo Across Türkiye</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.20/leaflet-maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/webm-muxer@5/build/webm-muxer.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #21262d;
      --accent: #f0a500; --text: #e6edf3; --muted: #8b949e;
      --walk: #3fb950; --drive: #4363d8;
    }
    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }
    .app { display: flex; height: 100vh; overflow: hidden; }

    .sidebar {
      width: 300px; min-width: 260px; background: var(--panel);
      border-right: 1px solid var(--border); display: flex;
      flex-direction: column; overflow-y: auto; z-index: 10;
      transition: width .25s ease, min-width .25s ease;
    }
    .sidebar.collapsed { width: 0; min-width: 0; overflow: hidden; border-right: none; }

    .sidebar-toggle {
      position: fixed; top: 130px; left: 284px;
      width: 32px; height: 32px; background: var(--panel);
      border: 1px solid var(--border); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 1000; color: var(--text); font-size: 14px;
      transition: left .25s ease, transform .25s ease;
    }
    .sidebar-toggle:hover { background: #21262d; }
    .sidebar-toggle.collapsed { left: 16px; transform: rotate(180deg); }

    .sidebar-header { padding: 28px 24px 20px; border-bottom: 1px solid var(--border); }
    .eyebrow { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
    .sidebar-header h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 900; line-height: 1; }
    .sidebar-header h1 span { color: var(--accent); }

    .section-label { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }

    .stats { padding: 20px 24px; border-bottom: 1px solid var(--border); }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px 12px; position: relative; overflow: hidden; }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; }
    .stat-card.c1::before { background: #f0a500; }
    .stat-card.c2::before { background: #58a6ff; }
    .stat-card.c3::before { background: #3fb950; }
    .stat-card.c4::before { background: #d2a8ff; }
    .stat-card.c5::before { background: #e05a00; }
    .stat-card.wide { grid-column: 1 / -1; }
    .stat-value { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 900; line-height: 1; }
    .stat-unit { font-size: 11px; color: var(--muted); margin-left: 2px; }
    .stat-name { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .routes { padding: 20px 24px; flex: 1; }

    .day-filter { padding: 20px 24px; border-bottom: 1px solid var(--border); }
    .day-filter-row { display: flex; align-items: center; gap: 8px; }
    .day-filter-row select {
      flex: 1; min-width: 0; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px;
      font-size: 12px; font-family: 'Inter', sans-serif;
    }
    .day-filter-sep { color: var(--muted); font-size: 12px; }
    .day-reset-btn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 6px; padding: 6px 10px; font-size: 11px; cursor: pointer;
      font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: .05em;
      flex-shrink: 0;
    }
    .day-reset-btn:hover { color: var(--text); border-color: var(--muted); }

    .export-panel { padding: 20px 24px; border-bottom: 1px solid var(--border); }
    .export-row { display: flex; align-items: center; gap: 8px; }
    .export-row label { font-size: 12px; color: var(--muted); }
    .export-row input {
      width: 64px; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px;
      font-size: 12px; font-family: 'Inter', sans-serif;
    }
    .export-status { font-size: 11px; color: var(--muted); margin-top: 8px; min-height: 14px; }

    .play-btn {
      position: absolute; bottom: 46px; right: 16px;
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--panel); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 1000; color: var(--text); font-size: 18px;
      box-shadow: 0 2px 10px rgba(0,0,0,.5);
      transition: background .15s, transform .15s;
    }
    .play-btn:hover { background: #21262d; transform: scale(1.05); }
    .play-btn.playing { color: var(--accent); }

    .record-btn {
      position: absolute; bottom: 46px; right: 72px;
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--panel); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 1000; color: var(--text); font-size: 18px;
      box-shadow: 0 2px 10px rgba(0,0,0,.5);
      transition: background .15s, transform .15s;
    }
    .record-btn:hover { background: #21262d; transform: scale(1.05); }
    .record-btn.exporting { color: #f85149; cursor: default; }
    .record-btn.exporting:hover { transform: none; }

    .follow-toggle {
      position: absolute; bottom: 46px; right: 128px;
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--panel); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 1000; color: var(--muted); font-size: 18px;
      box-shadow: 0 2px 10px rgba(0,0,0,.5);
      transition: background .15s, color .15s, border-color .15s;
    }
    .follow-toggle:hover { background: #21262d; }
    .follow-toggle.active { color: var(--accent); border-color: var(--accent); }

    .legend { display: flex; gap: 16px; margin-bottom: 16px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-dot.walk { background: var(--walk); }
    .legend-dot.drive { background: var(--drive); }

    .route-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; transition: opacity .15s; }
    .route-item:last-child { border-bottom: none; }
    .route-item:hover { opacity: .7; }
    .route-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .route-info { flex: 1; min-width: 0; }
    .route-name { font-size: 13px; font-weight: 500; }
    .route-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .start-marker { font-size: 20px; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); transform: translate(-50%, -50%); display: inline-block; }
    .current-marker { font-size: 26px; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); transform: translate(-50%, -50%); display: inline-block; }

    .map-wrap { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }
    .leaflet-control-attribution { background: rgba(13,17,23,.8) !important; color: var(--muted) !important; font-size: 10px !important; }
    .leaflet-control-zoom a { background: var(--panel) !important; color: var(--text) !important; border-color: var(--border) !important; }

  </style>
</head>
<body>
<div class="app">
  <div class="sidebar-toggle" id="sidebar-toggle">&#8249;</div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="eyebrow">Viggo travels</div>
      <h1>🇹🇷 Across Türkiye</h1>
    </div>
    <div class="stats">
      <div class="section-label">Summary</div>
      <div class="stat-grid">
        <div class="stat-card wide c1">
          <div class="stat-value" id="stat-km">&#8212;<span class="stat-unit">km</span></div>
          <div class="stat-name">Total distance travelled</div>
        </div>
        <div class="stat-card c2">
          <div class="stat-value" id="stat-days">&#8212;</div>
          <div class="stat-name">Days travelled</div>
        </div>
        <div class="stat-card c3">
          <div class="stat-value" id="stat-avg">&#8212;</div>
          <div class="stat-name">Average distance pr. day</div>
        </div>
        <div class="stat-card c4">
          <div class="stat-value" id="stat-drive">&#8212;<span class="stat-unit">km</span></div>
          <div class="stat-name">Distance hitchhiked</div>
        </div>
        <div class="stat-card c5">
          <div class="stat-value" id="stat-walk">&#8212;<span class="stat-unit">km</span></div>
          <div class="stat-name">Distance walked</div>
        </div>
      </div>
    </div>
    <div class="day-filter" id="day-filter" style="display:none;">
      <div class="section-label">Days</div>
      <div class="day-filter-row">
        <select id="day-from"></select>
        <span class="day-filter-sep">&ndash;</span>
        <select id="day-to"></select>
        <button type="button" id="day-reset" class="day-reset-btn" title="Show all days">All</button>
      </div>
    </div>
    <div class="export-panel">
      <div class="section-label">Video export</div>
      <div class="export-row">
        <label for="export-duration">Duration</label>
        <input type="number" id="export-duration" min="1" max="600" step="1" value="12" />
        <span class="day-filter-sep">sec</span>
      </div>
      <div class="export-row" style="margin-top:10px;">
        <label for="export-zoomout">Zoom out at end</label>
        <input type="number" id="export-zoomout" min="0" max="10" step="0.5" value="0" />
        <span class="day-filter-sep">levels</span>
      </div>
      <div class="export-status" id="export-status"></div>
    </div>
    <div class="routes">
      <div class="section-label">Routes</div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot walk"></div>Walking</div>
        <div class="legend-item"><div class="legend-dot drive"></div>Hitchhiking</div>
      </div>
      <div id="route-list"></div>
    </div>
  </aside>
  <div class="map-wrap">
    <div id="map"></div>
    <div class="follow-toggle" id="follow-toggle" title="Follow the traveler while animating">&#127919;</div>
    <div class="record-btn" id="record-btn" title="Record animation as a video">&#128249;</div>
    <div class="play-btn" id="play-btn" title="Play route animation">&#9654;</div>
  </div>
</div>

<script>
// ── Map ────────────────────────────────────────────────────────────────────
var CARTO_STYLE_URL = 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json?key=__CARTO_API_KEY__';
var map = L.map('map', { center: [39.245472, 35.487361], zoom: 6, minZoom: 1 });
L.maplibreGL({
  style: CARTO_STYLE_URL,
  attribution: '&copy; <a href="https://carto.com/">CARTO</a>, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

function getIconSize(baseSize) {
  var zoom = map.getZoom();
  // Scale: small at low zoom, large at high zoom. Base zoom = 10.
  var scale = Math.pow(1.2, zoom - 10);
  scale = Math.max(0.4, Math.min(scale, 3));
  return Math.round(baseSize * scale);
}

function updateIconSizes() {
  var currentSize = getIconSize(26);

  document.querySelectorAll('.current-marker').forEach(function(el) {
    el.style.fontSize = currentSize + 'px';
  });

  if (currentMarker) {
    currentMarker.setIcon(L.divIcon({
      className: '',
      html: currentMarker.getIcon().options.html,
      iconAnchor: [0, 0]
    }));
  }
}

map.on('zoomend', updateIconSizes);

// ── Config ─────────────────────────────────────────────────────────────────
var currentMarker = null;
var startMarker    = null;
var dayFilter       = null;  // { min, max } or null = show all days
var dayFilterInitialized = false;
var MANIFEST  = './Routes/manifest.json';
var TYPE_COLORS = {
  walk:  '#3fb950',
  drive: '#4363d8'
};
var TYPE_EMOJI = {
  walk:  '🚶🏼‍♂️', // walking figure
  drive: '🚶🏼‍♂️'  // car
};
var TYPE_LABEL = {
  walk:  'Walk',
  drive: 'Drive'
};
var rides = [];

// ── Haversine ──────────────────────────────────────────────────────────────
function haversine(lat1, lon1, lat2, lon2) {
  var R = 6371000, r = Math.PI / 180;
  var f1 = lat1*r, f2 = lat2*r, df = (lat2-lat1)*r, dl = (lon2-lon1)*r;
  var a = Math.sin(df/2)*Math.sin(df/2) + Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)*Math.sin(dl/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ── GPX parser ─────────────────────────────────────────────────────────────
function parseGPX(xmlStr) {
  var latLngs = [], dist = 0, elev = 0, prev = null;

  // Regex-based parsing — much faster than DOMParser on mobile
  var ptRe = /<trkpt[^>]+lat=["']([^"']+)["'][^>]+lon=["']([^"']+)["'][^>]*>([\s\S]*?)<\/trkpt>/g;
  var eleRe = /<ele>([^<]+)<\/ele>/;
  var timeRe = /<time>([^<]+)<\/time>/;
  var match;
  var firstPtTime = null;

  while ((match = ptRe.exec(xmlStr)) !== null) {
    var lat = parseFloat(match[1]);
    var lon = parseFloat(match[2]);
    var eleMatch = eleRe.exec(match[3]);
    var ele = eleMatch ? parseFloat(eleMatch[1]) : NaN;
    if (isNaN(lat) || isNaN(lon)) continue;
    if (prev) {
      dist += haversine(prev.lat, prev.lon, lat, lon);
      if (!isNaN(ele) && !isNaN(prev.ele) && ele > prev.ele) elev += ele - prev.ele;
    } else {
      var ptTimeMatch = timeRe.exec(match[3]);
      if (ptTimeMatch) firstPtTime = ptTimeMatch[1];
    }
    prev = { lat: lat, lon: lon, ele: ele };
    latLngs.push([lat, lon]);
  }

  if (latLngs.length < 2) return null;

  // Prefer the first trackpoint's own timestamp (when recording actually
  // started) over any <time> in <metadata>, which is usually the file's
  // export/creation time and can be misleading for ordering routes.
  var date = firstPtTime ? new Date(firstPtTime) : (function() {
    var m = xmlStr.match(/<time>([^<]+)<\/time>/);
    return m ? new Date(m[1]) : null;
  })();

  // Extract mode of travel. GPS Logger writes a comment like
  // "<!-- Activity = car -->" (sometimes misspelled "Acitvity"); some other
  // apps use a <type> tag instead, e.g. <trk><type>driving</type>...
  var activityMatch = xmlStr.match(/<!--\s*Activity\s*=\s*([^\s>-]+)\s*-->/i);
  var typeMatch      = xmlStr.match(/<type>([^<]+)<\/type>/i);
  var modeRaw = (activityMatch ? activityMatch[1] : (typeMatch ? typeMatch[1] : '')).trim().toLowerCase();
  var type = /drive|car/.test(modeRaw) ? 'drive' : 'walk';

  return { latLngs: latLngs, distKm: dist / 1000, elevM: Math.round(elev), date: date, type: type };
}

// ── Day filtering ──────────────────────────────────────────────────────────
// Day numbers come from grouping each route's own timestamp by calendar
// date, not from filenames — 1 is the earliest date seen, 2 the next, etc.
// Routes with no usable timestamp are always shown, since they can't be
// placed into a day.
function assignDayNumbers() {
  var dateStrs = [];
  rides.forEach(function(r) {
    if (r.date && !isNaN(r.date)) {
      var d = r.date.toISOString().slice(0, 10);
      if (dateStrs.indexOf(d) === -1) dateStrs.push(d);
    }
  });
  dateStrs.sort();
  var dayMap = {};
  dateStrs.forEach(function(d, i) { dayMap[d] = i + 1; });
  rides.forEach(function(r) {
    r.dayNumber = (r.date && !isNaN(r.date)) ? dayMap[r.date.toISOString().slice(0, 10)] : null;
  });
}

function isRideVisible(r) {
  if (!dayFilter) return true;
  if (r.dayNumber === null || r.dayNumber === undefined) return true;
  return r.dayNumber >= dayFilter.min && r.dayNumber <= dayFilter.max;
}

function getVisibleRides() {
  return rides.filter(isRideVisible);
}

function applyVisibilityStyles() {
  rides.forEach(function(r) {
    r.polyline.setStyle({ opacity: isRideVisible(r) ? 0.9 : 0 });
  });
}

function computeMaxDay() {
  var max = 0;
  rides.forEach(function(r) { if (r.dayNumber) max = Math.max(max, r.dayNumber); });
  return max;
}

function populateDayFilterOptions() {
  var maxDay = computeMaxDay();
  var wrap = document.getElementById('day-filter');

  if (maxDay < 2) { wrap.style.display = 'none'; dayFilter = null; return; }

  var fromSel = document.getElementById('day-from');
  var toSel   = document.getElementById('day-to');
  var opts = '';
  for (var d = 1; d <= maxDay; d++) opts += '<option value="' + d + '">Day ' + d + '</option>';
  if (fromSel.innerHTML !== opts) fromSel.innerHTML = opts;
  if (toSel.innerHTML !== opts) toSel.innerHTML = opts;

  if (!dayFilterInitialized) {
    dayFilterInitialized = true;
    dayFilter = { min: 1, max: maxDay };
  } else {
    // Keep the user's current selection, clamped to the (possibly changed) range.
    var min = Math.min(Math.max(dayFilter ? dayFilter.min : 1, 1), maxDay);
    var max = Math.max(min, Math.min(dayFilter ? dayFilter.max : maxDay, maxDay));
    dayFilter = { min: min, max: max };
  }

  fromSel.value = dayFilter.min;
  toSel.value   = dayFilter.max;
  wrap.style.display = 'block';
}

function refreshFilteredView() {
  applyVisibilityStyles();
  updateStats();
  renderRouteList();
  placeCurrentMarker();
  placeStartMarker();
}

function onDayFilterChange() {
  if (animating) stopAnimation();
  var fromSel = document.getElementById('day-from');
  var toSel   = document.getElementById('day-to');
  var min = parseInt(fromSel.value, 10);
  var max = parseInt(toSel.value, 10);
  if (min > max) { max = min; toSel.value = max; }
  dayFilter = { min: min, max: max };
  refreshFilteredView();
}

document.getElementById('day-from').addEventListener('change', onDayFilterChange);
document.getElementById('day-to').addEventListener('change', onDayFilterChange);
document.getElementById('day-reset').addEventListener('click', function() {
  if (animating) stopAnimation();
  var maxDay = computeMaxDay();
  dayFilter = { min: 1, max: maxDay };
  document.getElementById('day-from').value = 1;
  document.getElementById('day-to').value = maxDay;
  refreshFilteredView();
});

// ── Stats ──────────────────────────────────────────────────────────────────
function fmt(km) { return km >= 100 ? Math.round(km).toLocaleString() : km.toFixed(1); }
function setHTML(id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html; }

function updateStats() {
  var visible = getVisibleRides();
  if (!visible.length) {
    ['stat-km','stat-avg','stat-drive','stat-walk'].forEach(function(id){ setHTML(id, '&#8212;<span class="stat-unit">km</span>'); });
    setHTML('stat-days', '&#8212;');
    return;
  }
  var totalKm   = visible.reduce(function(s,r){ return s + r.distKm; }, 0);
  var driveKm   = visible.filter(function(r){ return r.type === 'drive'; }).reduce(function(s,r){ return s + r.distKm; }, 0);
  var walkKm    = visible.filter(function(r){ return r.type === 'walk';  }).reduce(function(s,r){ return s + r.distKm; }, 0);
  var dated     = visible.filter(function(r){ return r.date && !isNaN(r.date); });
  var days      = new Set(dated.map(function(r){ return r.date.toISOString().slice(0,10); })).size;

  setHTML('stat-km',    fmt(totalKm) + '<span class="stat-unit">km</span>');
  setHTML('stat-days',  String(days));
  setHTML('stat-avg',   fmt(days ? totalKm/days : totalKm) + '<span class="stat-unit">km</span>');
  setHTML('stat-drive', fmt(driveKm) + '<span class="stat-unit">km</span>');
  setHTML('stat-walk',  fmt(walkKm)  + '<span class="stat-unit">km</span>');
}

// ── Route list ─────────────────────────────────────────────────────────────
function renderRouteList() {
  var list = document.getElementById('route-list');
  if (!rides.length) { list.innerHTML = '<p style="font-size:12px;color:var(--muted);">No routes yet.</p>'; return; }

  var visible = getVisibleRides();
  if (!visible.length) { list.innerHTML = '<p style="font-size:12px;color:var(--muted);">No routes for the selected days.</p>'; return; }

  // Newest (highest order) first, matching the old "most recent first" feel.
  var sorted = visible.slice().sort(function(a,b){ return b.order - a.order; });

  list.innerHTML = sorted.map(function(r) {
    var dateStr = (r.date && !isNaN(r.date)) ? ' &middot; ' + r.date.toLocaleDateString('da-DK', {day:'numeric',month:'short',year:'numeric'}) : '';
    var typeStr = TYPE_LABEL[r.type] || r.type;
    return '<div class="route-item" data-id="' + r.id + '">'
      + '<div class="route-dot" style="background:' + r.color + '"></div>'
      + '<div class="route-info">'
      + '<div class="route-name" title="' + r.name + '">' + r.name + '</div>'
      + '<div class="route-meta">' + typeStr + ' &middot; ' + fmt(r.distKm) + ' km &middot; ' + r.elevM.toLocaleString() + ' m &uarr;' + dateStr + '</div>'
      + '</div></div>';
  }).join('');

  list.querySelectorAll('.route-item').forEach(function(el) {
    var id = parseInt(el.dataset.id);
    el.addEventListener('mouseenter', function(){ rides[id].polyline.setStyle({ weight: 6, opacity: 1 }); });
    el.addEventListener('mouseleave', function(){ rides[id].polyline.setStyle({ weight: 3.5, opacity: 0.9 }); });
    el.addEventListener('click', function(){ map.fitBounds(L.latLngBounds(rides[id].latLngs).pad(0.12)); });
  });
}

// ── Start / current position markers ──────────────────────────────────────
function placeStartMarker() {
  if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
  var visible = getVisibleRides();
  if (!visible.length) return;
  var first = visible.reduce(function(a,b){ return a.order < b.order ? a : b; });
  var firstPt = first.latLngs[0];
  var icon = L.divIcon({ className: '', html: '<div class="start-marker">🔸</div>', iconAnchor: [0, 0] });
  startMarker = L.marker(firstPt, { icon: icon, zIndexOffset: 900 }).addTo(map)
    .bindTooltip('Start', { permanent: false, direction: 'top', offset: [0, -8] });
}

function placeCurrentMarker() {
  if (currentMarker) { map.removeLayer(currentMarker); currentMarker = null; }
  var visible = getVisibleRides();
  if (!visible.length) return;
  var newest = visible.reduce(function(a,b){ return a.order > b.order ? a : b; });
  var lastPt = newest.latLngs[newest.latLngs.length - 1];
  var emoji  = TYPE_EMOJI[newest.type] || TYPE_EMOJI.walk;
  var icon   = L.divIcon({ className: '', html: '<div class="current-marker">' + emoji + '</div>', iconAnchor: [0, 0] });
  currentMarker = L.marker(lastPt, { icon: icon, zIndexOffset: 1000 }).addTo(map)
    .bindTooltip(newest.name, { permanent: false, direction: 'top', offset: [0, -10] });
}

// ── Cache GPX text in localStorage — repeat visits are instant ────────────
// Filenames can contain spaces, colons, '#', etc. — encode them so the
// request actually reaches the file instead of being mangled as a URL
// fragment (a bare '#' truncates everything after it).
function routeUrl(filename) {
  return './Routes/' + encodeURIComponent(filename);
}

function readCache(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function writeCache(key, value) {
  try { localStorage.setItem(key, value); } catch (e) {}
}

// Drop any cached GPX text for files no longer listed in manifest.json —
// covers both deletions and renames (a rename creates a new cache key and
// leaves the old one orphaned).
function pruneStaleCache(manifest) {
  var keep = {};
  manifest.forEach(function(filename) { keep['gpx:' + filename] = true; });
  try {
    for (var i = localStorage.length - 1; i >= 0; i--) {
      var key = localStorage.key(i);
      if (key && key.indexOf('gpx:') === 0 && !keep[key]) {
        localStorage.removeItem(key);
      }
    }
  } catch (e) {}
}

// Parses one GPX file's text into a ride object with its polyline already
// added to the map. The display name is always the filename (sans .gpx).
function buildRide(filename, fallbackOrder, gpxText) {
  var data = parseGPX(gpxText);
  if (!data || data.latLngs.length < 2) return null;
  // Chronological order comes from the GPX's own timestamp; routes without
  // a <time> tag fall back to their position in manifest.json.
  var order = (data.date && !isNaN(data.date)) ? data.date.getTime() : fallbackOrder;
  var color = TYPE_COLORS[data.type] || TYPE_COLORS.walk;
  var polyline = L.polyline(data.latLngs, { color: color, weight: 3.5, opacity: 0.9, lineJoin: 'round' }).addTo(map);
  return {
    filename: filename,
    order: order,
    type: data.type,
    name: filename.replace(/\.gpx$/i, ''),
    color: color,
    distKm: data.distKm,
    elevM: data.elevM,
    date: data.date,
    polyline: polyline,
    latLngs: data.latLngs
  };
}

function resortRides() {
  rides.sort(function(a, b) { return a.order - b.order; });
  rides.forEach(function(r, i) { r.id = i; });
  assignDayNumbers();
}

function renderEverything() {
  if (animating) stopAnimation();
  populateDayFilterOptions();
  refreshFilteredView();
}

// ── Load all routes ────────────────────────────────────────────────────────
// Two-phase load: paint instantly from whatever's cached (or fetch fresh for
// anything never seen before), then quietly re-check every cached file
// against the server and swap in updates if the file on disk has changed.
function loadAllRoutes() {
  var ridesByFile = {};

  fetch(MANIFEST + '?' + Date.now())
    .then(function(res) {
      if (!res.ok) throw new Error('manifest.json not found, status: ' + res.status);
      return res.json();
    })
    .then(function(manifest) {
      pruneStaleCache(manifest);
      var toRevalidate = []; // entries that came from cache and should be double-checked

      var firstPaint = manifest.map(function(filename, idx) {
        var key = 'gpx:' + filename;
        var cachedText = readCache(key);

        if (cachedText) {
          toRevalidate.push({ filename: filename, idx: idx, key: key, cachedText: cachedText });
          return { filename: filename, idx: idx, text: cachedText };
        }

        return fetch(routeUrl(filename))
          .then(function(res) { return res.ok ? res.text() : null; })
          .then(function(text) {
            if (text) writeCache(key, text);
            return { filename: filename, idx: idx, text: text };
          })
          .catch(function() { return { filename: filename, idx: idx, text: null }; });
      });

      return Promise.all(firstPaint).then(function(results) {
        results.filter(function(r) { return r.text; }).forEach(function(r) {
          var ride = buildRide(r.filename, r.idx, r.text);
          if (!ride) return;
          rides.push(ride);
          ridesByFile[r.filename] = ride;
        });
        resortRides();
        renderEverything();
        revalidateInBackground(toRevalidate, ridesByFile);
      });
    })
    .catch(function(e) { console.error('FATAL loadAllRoutes:', e.message, e.stack); });
}

function revalidateInBackground(entries, ridesByFile) {
  if (!entries.length) return;
  var anyChanged = false;

  var checks = entries.map(function(e) {
    return fetch(routeUrl(e.filename))
      .then(function(res) { return res.ok ? res.text() : null; })
      .then(function(freshText) {
        if (!freshText || freshText === e.cachedText) return;
        writeCache(e.key, freshText);
        var newRide = buildRide(e.filename, e.idx, freshText);
        if (!newRide) return;
        var oldRide = ridesByFile[e.filename];
        if (oldRide) {
          map.removeLayer(oldRide.polyline);
          rides[rides.indexOf(oldRide)] = newRide;
        } else {
          rides.push(newRide);
        }
        ridesByFile[e.filename] = newRide;
        anyChanged = true;
      })
      .catch(function() {});
  });

  Promise.all(checks).then(function() {
    if (anyChanged) {
      resortRides();
      renderEverything();
    }
  });
}

// ── Route animation ────────────────────────────────────────────────────────
// Plays the currently visible (day-filtered) routes in chronological order,
// tracing each one out point-by-point with a moving marker, then restores
// the normal static view.
var animating = false;
var animLayers = [];
var followEnabled = false;

document.getElementById('follow-toggle').addEventListener('click', function() {
  followEnabled = !followEnabled;
  this.classList.toggle('active', followEnabled);
});

function stopAnimation() {
  if (!animating) return;
  animating = false;
  animLayers.forEach(function(l) { map.removeLayer(l); });
  animLayers = [];
  applyVisibilityStyles();
  placeCurrentMarker();
  placeStartMarker();
  var btn = document.getElementById('play-btn');
  btn.innerHTML = '&#9654;';
  btn.title = 'Play route animation';
  btn.classList.remove('playing');
}

function playAnimation() {
  var visible = getVisibleRides().slice().sort(function(a, b) { return a.order - b.order; });
  if (!visible.length) return;
  animating = true;

  var btn = document.getElementById('play-btn');
  btn.innerHTML = '&#9632;';
  btn.title = 'Stop animation';
  btn.classList.add('playing');

  visible.forEach(function(r) { r.polyline.setStyle({ opacity: 0 }); });
  // Hide the static start/current-position markers so only the moving
  // traveler marker is visible while the animation plays.
  if (currentMarker) { map.removeLayer(currentMarker); currentMarker = null; }
  //if (startMarker)   { map.removeLayer(startMarker);   startMarker   = null; }

  function travelerIcon(type) {
    return L.divIcon({ className: '', html: '<div class="current-marker">' + (TYPE_EMOJI[type] || TYPE_EMOJI.walk) + '</div>', iconAnchor: [0, 0] });
  }
  var traveler = L.marker(visible[0].latLngs[0], { icon: travelerIcon(visible[0].type), zIndexOffset: 1200 }).addTo(map);
  animLayers.push(traveler);

  var idx = 0;
  function animateNext() {
    if (!animating) return;
    if (idx >= visible.length) { stopAnimation(); return; }

    var r = visible[idx];
    var animLine = L.polyline([], { color: r.color, weight: 4, opacity: 1 }).addTo(map);
    animLayers.push(animLine);
    traveler.setIcon(travelerIcon(r.type));

    var pts = r.latLngs;
    var durationMs = Math.max(500, Math.min(4000, r.distKm * 60));
    var startTime = null;

    function frame(ts) {
      if (!animating) return;
      if (!startTime) startTime = ts;
      var progress = Math.min(1, (ts - startTime) / durationMs);
      var count = Math.max(2, Math.round(pts.length * progress));
      var slice = pts.slice(0, count);
      animLine.setLatLngs(slice);
      var head = slice[slice.length - 1];
      traveler.setLatLng(head);
      if (followEnabled) map.setView(head, map.getZoom(), { animate: false });
      if (progress < 1) {
        requestAnimationFrame(frame);
      } else {
        idx++;
        animateNext();
      }
    }
    requestAnimationFrame(frame);
  }
  animateNext();
}

document.getElementById('play-btn').addEventListener('click', function() {
  if (animating) stopAnimation(); else playAnimation();
});

// ── Video export ───────────────────────────────────────────────────────────
// Renders the animation directly to an MP4 file — no screen/tab capture, so
// there's no cursor, browser UI, or sidebar in the output. It works by
// spinning up a second, invisible map fixed at exactly 1920x1080, drawing
// each frame onto an offscreen canvas (basemap + route lines + traveler,
// all placed by projecting lat/lng through that hidden map), and encoding
// the frames with the browser's native WebCodecs VideoEncoder. Because we
// generate frames rather than capture them in real time, the output's
// length is exactly whatever duration is entered — not tied to how long
// rendering actually takes on this machine.
var EXPORT_WIDTH  = 1920;
var EXPORT_HEIGHT = 1080;
var EXPORT_FPS    = 30;
var exporting = false;

function setExportStatus(msg) {
  document.getElementById('export-status').textContent = msg || '';
}

function updateExportBtn(active) {
  var btn = document.getElementById('record-btn');
  btn.classList.toggle('exporting', active);
  btn.title = active ? 'Rendering video…' : 'Export animation as a video';
}

// Builds a hidden map (same basemap style, no controls) at the export
// resolution, used purely as a coordinate/render source — never shown.
function createExportMap() {
  var container = document.createElement('div');
  container.style.position = 'fixed';
  container.style.left = '-99999px';
  container.style.top = '0';
  container.style.width = EXPORT_WIDTH + 'px';
  container.style.height = EXPORT_HEIGHT + 'px';
  document.body.appendChild(container);

  var exportMap = L.map(container, {
    zoomControl: false, attributionControl: false,
    fadeAnimation: false, zoomAnimation: false, inertia: false,
    center: map.getCenter(), zoom: map.getZoom()
  });
  var glLayer = L.maplibreGL({ style: CARTO_STYLE_URL }).addTo(exportMap);

  return { leafletMap: exportMap, glLayer: glLayer, container: container };
}

function destroyExportMap(em) {
  em.leafletMap.remove();
  if (em.container.parentNode) em.container.parentNode.removeChild(em.container);
}

// Waits until the hidden map's underlying MapLibre instance has actually
// finished loading and rendering the current view (style + tiles), rather
// than just waiting a fixed number of frames — this is what was causing the
// first couple of exported frames to show an unrendered/blank map.
function waitForMapIdle(maplibreMap, timeoutMs) {
  return new Promise(function(resolve) {
    var done = false;
    function finish() { if (!done) { done = true; resolve(); } }
    maplibreMap.once('idle', finish);
    setTimeout(finish, timeoutMs || 4000); // safety net if 'idle' never fires
  });
}

function waitForMapLoad(maplibreMap, timeoutMs) {
  return new Promise(function(resolve) {
    if (maplibreMap.loaded && maplibreMap.loaded()) { resolve(); return; }
    var done = false;
    function finish() { if (!done) { done = true; resolve(); } }
    maplibreMap.once('load', finish);
    setTimeout(finish, timeoutMs || 6000);
  });
}

// Not every browser that exposes `VideoEncoder` can actually encode every
// codec (Firefox, notably, has the API and can even report a codec as
// "supported", but then fails partway through real use). So rather than
// trusting isConfigSupported alone, we actually configure a throwaway
// encoder and push one real frame through it for each candidate, and only
// commit to the first one that genuinely works end to end.
var EXPORT_CODEC_CANDIDATES = [
  { container: 'mp4',  ext: 'mp4',  mime: 'video/mp4',  encoderCodec: 'avc1.42001f',   muxerCodec: 'avc',
    lib: function() { return window.Mp4Muxer; } },
  { container: 'webm', ext: 'webm', mime: 'video/webm', encoderCodec: 'vp09.00.10.08', muxerCodec: 'V_VP9',
    lib: function() { return window.WebMMuxer; } },
  { container: 'webm', ext: 'webm', mime: 'video/webm', encoderCodec: 'vp8',           muxerCodec: 'V_VP8',
    lib: function() { return window.WebMMuxer; } }
];

function testEncodeOneFrame(codecStr, width, height) {
  return new Promise(function(resolve) {
    var settled = false;
    function finish(ok) { if (!settled) { settled = true; resolve(ok); } }
    var safetyTimer = setTimeout(function() { finish(false); }, 3000);

    try {
      var testEncoder = new VideoEncoder({
        output: function() {},
        error: function() { finish(false); }
      });
      testEncoder.configure({ codec: codecStr, width: width, height: height, bitrate: 1000000, framerate: 30 });

      var testCanvas = document.createElement('canvas');
      testCanvas.width = width;
      testCanvas.height = height;
      testCanvas.getContext('2d').fillRect(0, 0, width, height);

      var testFrame = new VideoFrame(testCanvas, { timestamp: 0 });
      testEncoder.encode(testFrame);
      testFrame.close();

      testEncoder.flush().then(function() {
        clearTimeout(safetyTimer);
        try { testEncoder.close(); } catch (e) {}
        finish(true);
      }).catch(function() { finish(false); });
    } catch (e) {
      finish(false);
    }
  });
}

async function pickExportCodec(width, height) {
  for (var i = 0; i < EXPORT_CODEC_CANDIDATES.length; i++) {
    var c = EXPORT_CODEC_CANDIDATES[i];
    if (!c.lib()) continue;
    try {
      var support = await VideoEncoder.isConfigSupported({ codec: c.encoderCodec, width: width, height: height });
      if (!support || !support.supported) continue;
    } catch (e) { continue; }

    var works = await testEncodeOneFrame(c.encoderCodec, width, height);
    if (works) return c;
  }
  return null;
}

function makeMuxer(codecInfo, width, height) {
  if (codecInfo.container === 'mp4') {
    return new Mp4Muxer.Muxer({
      target: new Mp4Muxer.ArrayBufferTarget(),
      video: { codec: codecInfo.muxerCodec, width: width, height: height },
      fastStart: 'in-memory'
    });
  }
  return new WebMMuxer.Muxer({
    target: new WebMMuxer.ArrayBufferTarget(),
    video: { codec: codecInfo.muxerCodec, width: width, height: height }
  });
}

async function exportVideo() {
  if (exporting) return;
  if (!window.VideoEncoder) {
    alert("Your browser doesn't support the WebCodecs API needed to render video here. Try a recent Chrome, Edge, Firefox, or Safari (16.4+).");
    return;
  }
  var visible = getVisibleRides().slice().sort(function(a, b) { return a.order - b.order; });
  if (!visible.length) { alert('No routes are currently visible to export.'); return; }

  exporting = true;
  updateExportBtn(true);
  setExportStatus('Checking video support…');

  var codecInfo = await pickExportCodec(EXPORT_WIDTH, EXPORT_HEIGHT);
  if (!codecInfo) {
    alert("This browser can't actually encode video with WebCodecs (tried H.264 and VP9/VP8), so export isn't available here.");
    exporting = false;
    updateExportBtn(false);
    setExportStatus('');
    return;
  }

  var durationInput = document.getElementById('export-duration');
  var duration = Math.max(1, parseFloat(durationInput.value) || 12);
  var totalFrames = Math.max(1, Math.round(duration * EXPORT_FPS));
  var zoomOutAmount = Math.max(0, parseFloat(document.getElementById('export-zoomout').value) || 0);

  setExportStatus('Preparing…');

  // Allocate time per route proportional to its distance, so longer legs
  // get proportionally more of the fixed total duration.
  var weights = visible.map(function(r) { return Math.max(r.distKm, 0.05); });
  var totalWeight = weights.reduce(function(s, w) { return s + w; }, 0);
  var routeStart = []; // fraction of total duration where each route begins
  var acc = 0;
  weights.forEach(function(w) { routeStart.push(acc / totalWeight); acc += w; });
  routeStart.push(1);

  var allPts = [];
  visible.forEach(function(r) { allPts = allPts.concat(r.latLngs); });
  var bounds = L.latLngBounds(allPts);

  var em = createExportMap();
  var mlMap = em.glLayer.getMaplibreMap();
  await waitForMapLoad(mlMap);
  if (!followEnabled) {
    em.leafletMap.fitBounds(bounds.pad(0.08), { animate: false });
  }
  await waitForMapIdle(mlMap, 8000);

  var canvas = document.createElement('canvas');
  canvas.width = EXPORT_WIDTH;
  canvas.height = EXPORT_HEIGHT;
  var ctx = canvas.getContext('2d');

  var muxer = makeMuxer(codecInfo, EXPORT_WIDTH, EXPORT_HEIGHT);
  var encoderError = null;
  var encoder = new VideoEncoder({
    output: function(chunk, meta) { muxer.addVideoChunk(chunk, meta); },
    error: function(e) { encoderError = e; }
  });
  encoder.configure({
    codec: codecInfo.encoderCodec,
    width: EXPORT_WIDTH,
    height: EXPORT_HEIGHT,
    bitrate: 10_000_000,
    framerate: EXPORT_FPS
  });
  // Give configure() a moment to settle (it can fail asynchronously) before
  // committing to the frame-render loop.
  await new Promise(function(r) { setTimeout(r, 50); });
  if (encoderError) {
    destroyExportMap(em);
    exporting = false;
    updateExportBtn(false);
    setExportStatus('');
    alert('Video export failed to start: ' + (encoderError.message || encoderError) + '\n\nThis can happen if the browser reports a codec as supported but can\'t actually use it. Try again — if it keeps happening, it may not be fixable in this browser.');
    return;
  }

  function travelerEmoji(type) { return TYPE_EMOJI[type] || TYPE_EMOJI.walk; }

  function findActiveIndex(progress) {
    for (var i = 0; i < visible.length; i++) {
      if (progress < routeStart[i + 1] || i === visible.length - 1) return i;
    }
    return visible.length - 1;
  }

  // Draws one frame (basemap + given route lines + traveler marker) and
  // hands it to the encoder. `partial` is optional: { route, count }.
  function compositeAndEncode(frameIndex, fullRoutes, partial, headLatLng, headType) {
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, 0, EXPORT_WIDTH, EXPORT_HEIGHT);
    ctx.drawImage(mlMap.getCanvas(), 0, 0, EXPORT_WIDTH, EXPORT_HEIGHT);

    function strokeLine(pts, color) {
      if (pts.length < 2) return;
      ctx.strokeStyle = color;
      ctx.lineWidth = 5;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (var p = 0; p < pts.length; p++) {
        var sp = em.leafletMap.latLngToContainerPoint(pts[p]);
        if (p === 0) ctx.moveTo(sp.x, sp.y); else ctx.lineTo(sp.x, sp.y);
      }
      ctx.stroke();
    }

    fullRoutes.forEach(function(r) { strokeLine(r.latLngs, r.color); });
    if (partial) strokeLine(partial.route.latLngs.slice(0, partial.count), partial.route.color);

    if (headLatLng) {
      var headScreen = em.leafletMap.latLngToContainerPoint(headLatLng);
      ctx.font = '44px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(travelerEmoji(headType), headScreen.x, headScreen.y);
    }

    var frame = new VideoFrame(canvas, { timestamp: Math.round(frameIndex * (1e6 / EXPORT_FPS)) });
    encoder.encode(frame);
    frame.close();
  }

  async function checkBackpressure() {
    if (encoderError) throw encoderError;
    while (encoder.encodeQueueSize > 4) {
      await new Promise(function(r) { setTimeout(r, 10); });
    }
    if (encoderError) throw encoderError;
  }

  try {
    var headPt, activeRoute;
    for (var f = 0; f < totalFrames; f++) {
      var progress = totalFrames === 1 ? 1 : f / (totalFrames - 1);
      var activeIdx = findActiveIndex(progress);
      activeRoute = visible[activeIdx];
      var localSpan = routeStart[activeIdx + 1] - routeStart[activeIdx];
      var localProgress = localSpan > 0 ? Math.min(1, Math.max(0, (progress - routeStart[activeIdx]) / localSpan)) : 1;
      var pts = activeRoute.latLngs;
      var count = Math.max(2, Math.round(pts.length * localProgress));
      headPt = pts[count - 1];

      if (followEnabled) {
        em.leafletMap.setView(headPt, em.leafletMap.getZoom(), { animate: false });
        await waitForMapIdle(mlMap, 2000);
      }

      compositeAndEncode(f, visible.slice(0, activeIdx), { route: activeRoute, count: count }, headPt, activeRoute.type);
      await checkBackpressure();

      if (f % 5 === 0 || f === totalFrames - 1) {
        setExportStatus('Rendering… ' + Math.round(((f + 1) / totalFrames) * 100) + '%');
      }
    }

    // Optional outro: pull the camera back from wherever it ended up, to
    // reveal more surrounding context once the route is fully drawn.
    if (zoomOutAmount > 0) {
      setExportStatus('Zooming out…');
      var outroFrames = Math.max(1, Math.round(2 * EXPORT_FPS));
      var startZoom = em.leafletMap.getZoom();
      var minZoom = em.leafletMap.getMinZoom ? em.leafletMap.getMinZoom() : 1;
      var endZoom = Math.max(minZoom, startZoom - zoomOutAmount);
      var centerPt = headPt;

      for (var z = 0; z < outroFrames; z++) {
        var zp = (z + 1) / outroFrames;
        var eased = 1 - Math.pow(1 - zp, 3); // ease-out cubic
        var zoomNow = startZoom - (startZoom - endZoom) * eased;
        em.leafletMap.setView(centerPt, zoomNow, { animate: false });
        await waitForMapIdle(mlMap, 1500);

        compositeAndEncode(totalFrames + z, visible, null, headPt, activeRoute.type);
        await checkBackpressure();
      }
    }

    setExportStatus('Finishing up…');
    await encoder.flush();
    if (encoderError) throw encoderError;
    muxer.finalize();

    var blob = new Blob([muxer.target.buffer], { type: codecInfo.mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'route-animation.' + codecInfo.ext;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
    setExportStatus('Done — video downloaded.');
    setTimeout(function() { setExportStatus(''); }, 4000);
  } catch (err) {
    console.error('Video export failed:', err);
    alert('Video export failed: ' + err.message);
    setExportStatus('');
  } finally {
    destroyExportMap(em);
    exporting = false;
    updateExportBtn(false);
  }
}

document.getElementById('record-btn').addEventListener('click', exportVideo);

// ── Sidebar toggle ─────────────────────────────────────────────────────────
document.getElementById('sidebar-toggle').addEventListener('click', function() {
  document.getElementById('sidebar').classList.toggle('collapsed');
  document.getElementById('sidebar-toggle').classList.toggle('collapsed');
  setTimeout(function(){ map.invalidateSize(); }, 260);
});

// ── Go ─────────────────────────────────────────────────────────────────────
loadAllRoutes();
</script>
